name: Build SMS Expenses app

on:
  push:
    paths:
      - ".github/workflows/android-sms.yml"

permissions:
  contents: write

jobs:
  remove-public-release:
    runs-on: ubuntu-latest
    steps:
      - name: Remove the public APK release (the app now lives in a private repo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete sms-app --yes --cleanup-tag --repo "${{ github.repository }}" || true
